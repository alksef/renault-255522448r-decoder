[platformio]
default_envs = scanner

[env:scanner]
platform = ststm32@19.4.0
board = genericSTM32F103C6
framework = libopencm3
platform_packages = platformio/framework-libopencm3@1.10000.260625
extra_scripts = pre:build_flags.py
upload_protocol = stlink
upload_command = openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts -f interface/stlink-dap.cfg -f target/stm32f1x.cfg -c "program {$SOURCE} verify reset; shutdown;"
board_upload.maximum_size = 32768
board_upload.maximum_ram_size = 6144
board_build.ldscript = c6.ld
build_flags = -Wall -Wextra -Werror
monitor_speed = 115200
